# Instagram comments catch-up: calls /api/cron/instagram every hour (token refresh, comments the webhook missed in the
# last 7 days of the latest 25 posts, queued replies). Vercel Hobby crons run once a day only, so vercel.json keeps the
# daily call and this is the hourly scheduler. The endpoint checks "Authorization: Bearer $CRON_SECRET" (the
# CRON_SECRET repository secret, same value as in Vercel). A non-2xx answer or a network failure fails the run.
name: Instagram comments cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram-comments-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/instagram
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://buyukkaravan.com/api/cron/instagram")
          echo "HTTP $status"
          head -c 500 response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::instagram cron answered HTTP $status"; exit 1; fi
