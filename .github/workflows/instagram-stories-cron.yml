# Instagram stories: every 10 minutes publishes approved stories that are due and expires unapproved ones after 18:00.
# Uses the same CRON_SECRET repository secret as instagram-direct-cron.yml. A non-2xx answer fails the run.
name: Instagram stories cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram-stories-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/instagram-stories
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 90 --retry 1 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://buyukkaravan.com/api/cron/instagram-stories")
          echo "HTTP $status"
          head -c 500 response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::instagram-stories cron answered HTTP $status"; exit 1; fi
