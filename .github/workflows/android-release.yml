# BK Admin Android: a tag "android-v1.0.0" (or a manual run) builds the signed AAB (Play Market) and APK (testing).
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android release
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Keystore from secrets
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      # Shows what is wrong with the signing secrets as annotations, without printing any secret value.
      - name: Check signing secrets
        env:
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          K: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::notice::keystore file: $(stat -c %s "$RUNNER_TEMP/upload.jks") bytes"
          for name in P A K; do [ -n "${!name}" ] || echo "::error::secret for $name is empty"; done
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$P" 2>&1); then echo "::error::keystore does not open with ANDROID_KEYSTORE_PASSWORD (or ANDROID_KEYSTORE_BASE64 is not the .jks): $(echo "$out" | head -1)"; exit 1; fi
          aliases=$(echo "$out" | grep -i "entry," | cut -d, -f1 | tr '\n' ' ')
          echo "$aliases" | grep -qw -- "$A" || { echo "::error::ANDROID_KEY_ALIAS is not in the keystore; aliases there: $aliases"; exit 1; }
          echo "::notice::keystore opens, alias found: $aliases"
      - name: Build AAB and APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bk-admin-android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
