# Instagram Direct reminders (30 min / 2 h), the 09:00 digest and the 20:00 report: calls the tick every 5 minutes.
# Vercel Hobby crons run once a day only, so this is the on-time scheduler. The endpoint checks
# "Authorization: Bearer $CRON_SECRET" (same value as CRON_SECRET in Vercel → Settings → Environment Variables);
# add it here under GitHub → Settings → Secrets and variables → Actions → New repository secret → CRON_SECRET.
# A non-2xx answer (401 wrong secret, 500 error) or a network failure fails the run.
name: Instagram Direct cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram-direct-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/instagram-direct
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://buyukkaravan.com/api/cron/instagram-direct")
          echo "HTTP $status"
          head -c 500 response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::instagram-direct cron answered HTTP $status"; exit 1; fi
