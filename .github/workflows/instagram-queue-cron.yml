# Instagram reply queue: calls /api/cron/instagram-queue every 10 minutes, so queued comment replies (8–25 s apart) do not
# wait for the hourly catch-up. An empty queue answers at once. The endpoint checks "Authorization: Bearer $CRON_SECRET"
# (the CRON_SECRET repository secret, same value as in Vercel). A non-2xx answer or a network failure fails the run.
name: Instagram queue cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram-queue-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/instagram-queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 100 --retry 2 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://buyukkaravan.com/api/cron/instagram-queue")
          echo "HTTP $status"
          head -c 500 response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::instagram-queue cron answered HTTP $status"; exit 1; fi
